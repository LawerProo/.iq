<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتوثيق الدعاوى القضائية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCnAg_4zW8BHVjKp_C-38E-0LNBj8OmyFg",
          authDomain: "lawyer-29611.firebaseapp.com",
          projectId: "lawyer-29611",
          storageBucket: "lawyer-29611.firebasestorage.app",
          messagingSenderId: "545328949989",
          appId: "1:545328949989:web:1f3e49f0a7a8269267020c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedFileBase64 = "";
        let selectedFileName = "";

        onAuthStateChanged(auth, async (user) => {
            const loginBox = document.getElementById('loginSection');
            const appBox = document.getElementById('appSection');
            const userEmailSpan = document.getElementById('userEmailDisplay');

            if (user) {
                currentUser = user;
                loginBox.style.display = 'none';
                appBox.style.display = 'block';
                userEmailSpan.textContent = user.email;
            } else {
                currentUser = null;
                loginBox.style.display = 'block';
                appBox.style.display = 'none';
                document.getElementById('email').value = "";
                document.getElementById('password').value = "";
            }
        });

        window.loginUser = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('loginError');

            if (!email || !password) {
                errorMsg.textContent = "يرجى إدخال البريد وكلمة المرور.";
                return;
            }

            try {
                errorMsg.style.color = "#3b82f6";
                errorMsg.textContent = "جاري تسجيل الدخول...";
                await signInWithEmailAndPassword(auth, email, password);
                errorMsg.textContent = "";
            } catch (error) {
                errorMsg.style.color = "#ef4444";
                errorMsg.textContent = "فشل: " + error.message;
            }
        };

        window.logoutUser = async function() {
            await signOut(auth);
        };

        window.changeUserPassword = async function() {
            if (!currentUser) return;
            const newPass = document.getElementById('newPassword').value.trim();
            const passMsg = document.getElementById('passMessage');

            if (!newPass || newPass.length < 6) {
                passMsg.style.color = "#ef4444";
                passMsg.textContent = "6 رموز على الأقل.";
                return;
            }

            try {
                passMsg.style.color = "#3b82f6";
                passMsg.textContent = "جاري التحديث...";
                await updatePassword(currentUser, newPass);
                passMsg.style.color = "#10b981";
                passMsg.textContent = "تم التحديث بنجاح! ✅";
                document.getElementById('newPassword').value = "";
                setTimeout(() => {
                    document.getElementById('passwordSection').style.display = "none";
                    passMsg.textContent = "";
                }, 3000);
            } catch (error) {
                passMsg.style.color = "#ef4444";
                passMsg.textContent = "فشل: " + error.message;
            }
        };

        window.togglePasswordSection = function() {
            const section = document.getElementById('passwordSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        };

        // إظهار وإخفاء نافذة الأرشيف المالي المنفصلة
        window.openFinancialModal = function() {
            document.getElementById('financialModal').style.display = 'flex';
        };

        window.closeFinancialModal = function() {
            document.getElementById('financialModal').style.display = 'none';
        };

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxWidth = 800;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedFileBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('fileInfo').innerHTML = `📎 تم ضغط وتجهيز الصورة بنجاح: <b>${file.name}</b>`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveDataToFirebase = async function() {
            if (!currentUser) return;
            const caseNumber = document.getElementById('caseNumber').value.trim();
            const complainant = document.getElementById('complainant').value.trim();
            
            if (!caseNumber || !complainant) {
                alert("يرجى إدخال رقم الدعوة واسم المشتكي/الموكل!");
                return;
            }

            try {
                const docId = caseNumber.replace(/\//g, '_');
                const caseData = {
                    userId: currentUser.uid,
                    caseNumber: caseNumber,
                    caseTitle: document.getElementById('caseTitle').value,
                    complainant: complainant,
                    complainantPhone: document.getElementById('complainantPhone').value,
                    defendant: document.getElementById('defendant').value,
                    court: document.getElementById('court').value,
                    nextHearingDate: document.getElementById('nextHearingDate').value,
                    totalFees: document.getElementById('totalFees').value,
                    paidFees: document.getElementById('paidFees').value,
                    courtExpenses: document.getElementById('courtExpenses').value,
                    locationUrl: document.getElementById('locationUrl').value,
                    privateNotes: document.getElementById('privateNotes').value,
                    watermarkText: document.getElementById('watermarkText').value,
                    barcodeSubText: document.getElementById('barcodeSubText').value,
                    fileData: selectedFileBase64 || "",
                    fileName: selectedFileName || ""
                };

                await setDoc(doc(db, "cases", docId), caseData);
                alert("تم حفظ الدعوة بنجاح تام! ✅");
            } catch (error) {
                alert("خطأ أثناء الحفظ: " + error.message);
            }
        };

        window.fetchDataFromFirebase = async function() {
            if (!currentUser) return;
            const queryNum = document.getElementById('searchQuery').value.trim();
            if (!queryNum) {
                alert("أدخل رقم الدعوة للبحث.");
                return;
            }

            try {
                const docId = queryNum.replace(/\//g, '_');
                const docSnap = await getDoc(doc(db, "cases", docId));

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('caseNumber').value = data.caseNumber || '';
                    document.getElementById('caseTitle').value = data.caseTitle || '';
                    document.getElementById('complainant').value = data.complainant || '';
                    document.getElementById('complainantPhone').value = data.complainantPhone || '';
                    document.getElementById('defendant').value = data.defendant || '';
                    document.getElementById('court').value = data.court || '';
                    document.getElementById('nextHearingDate').value = data.nextHearingDate || '';
                    checkHearingAlert(data.nextHearingDate);

                    document.getElementById('totalFees').value = data.totalFees || '';
                    document.getElementById('paidFees').value = data.paidFees || '';
                    document.getElementById('courtExpenses').value = data.courtExpenses || '';
                    document.getElementById('locationUrl').value = data.locationUrl || '';
                    document.getElementById('privateNotes').value = data.privateNotes || '';
                    document.getElementById('watermarkText').value = data.watermarkText || '';
                    document.getElementById('barcodeSubText').value = data.barcodeSubText || '';
                    
                    if (data.locationUrl) generateQRCode();
                    if (data.barcodeSubText) {
                        document.getElementById('barcodeSubTextDisplay').textContent = data.barcodeSubText;
                    }

                    selectedFileBase64 = data.fileData || "";
                    selectedFileName = data.fileName || "";

                    if (selectedFileName) {
                        document.getElementById('fileInfo').innerHTML = `📎 الملف المرفق: <a href="${selectedFileBase64}" download="${selectedFileName}" style="color: #2980b9; font-weight: bold;">تحميل (${selectedFileName})</a>`;
                    } else {
                        document.getElementById('fileInfo').textContent = "";
                    }
                    alert("تم استرجاع الدعوة بنجاح! 🔍");
                } else {
                    alert("لم يتم العثور على دعوة بهذا الرقم.");
                }
            } catch (error) {
                alert("خطأ: " + error.message);
            }
        };

        // التحقق من موعد الجلسة والوقت والتنبيه قبل يوم أو اليوم نفسه
        window.checkHearingAlert = function(dateTimeStr) {
            const alertBox = document.getElementById('hearingAlertBox');
            if (!dateTimeStr) {
                alertBox.style.display = 'none';
                return;
            }

            const hearingDate = new Date(dateTimeStr);
            const today = new Date();
            
            // مقارنة الأيام فقط للتنبيه المسبق قبل يوم أو في نفس اليوم
            const hearingDay = new Date(hearingDate.getFullYear(), hearingDate.getMonth(), hearingDate.getDate());
            const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            const diffTime = hearingDay - todayDay;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            
            const timeFormatted = hearingDate.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });

            if (diffDays === 0) {
                alertBox.style.display = 'block';
                alertBox.style.background = '#fee2e2';
                alertBox.style.color = '#991b1b';
                alertBox.style.borderColor = '#fca5a5';
                alertBox.textContent = `⚠️ تنبيه هام: موعد جلسة هذه الدعوة هو اليوم في تمام الساعة (${timeFormatted})!`;
            } else if (diffDays === 1) {
                alertBox.style.display = 'block';
                alertBox.style.background = '#fef3c7';
                alertBox.style.color = '#92400e';
                alertBox.style.borderColor = '#fde68a';
                alertBox.textContent = `⚠️ تنبيه: موعد جلسة هذه الدعوة غداً في تمام الساعة (${timeFormatted}) يرجى الاستعداد!`;
            } else {
                alertBox.style.display = 'none';
            }
        };
    </script>

    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --print-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: var(--text-main); }
        .container { width: 100%; max-width: 100%; background: var(--card-bg); margin: 0 auto; padding: 20px 30px; box-sizing: border-box; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); position: relative; }
        
        .auth-card { max-width: 380px; margin: 60px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; text-align: center; }
        .auth-card h2 { color: var(--primary-color); margin-bottom: 20px; font-size: 20px; }
        .auth-group { margin-bottom: 15px; text-align: right; }
        .auth-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .auth-group input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-main { background-color: var(--primary-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .error-text { font-size: 13px; margin-top: 10px; word-break: break-word; }
        
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid #bfdbfe; flex-wrap: wrap; gap: 10px; }
        .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-settings { background-color: var(--print-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-logout { background-color: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        .password-box { background: #fff; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .header-title { text-align: center; color: var(--primary-color); margin-bottom: 15px; font-size: 22px; font-weight: 700; }
        
        .search-container-top { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .search-box-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px 15px; border-radius: 10px; display: flex; gap: 8px; align-items: center; }
        .search-box-item input { flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; background: #fff; outline: none; }
        .btn-search { background-color: var(--secondary-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; white-space: nowrap; }

        .section-title { font-size: 14px; font-weight: bold; color: var(--primary-color); border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin: 20px 0 10px 0; grid-column: span 3; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 15px; align-items: end; }
        .form-group { margin-bottom: 10px; }
        .form-group.full-width { grid-column: span 3; }
        
        label { display: block; margin-bottom: 4px; font-weight: 600; color: #475569; font-size: 12.5px; }
        input[type="text"], input[type="url"], input[type="file"], input[type="email"], input[type="password"], input[type="datetime-local"], input[type="number"], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13.5px; box-sizing: border-box; background: #fdfdfd; font-family: inherit; }
        input[type="file"] { padding: 5px; background: #f8fafc; cursor: pointer; }
        textarea { resize: vertical; height: 50px; }

        /* صندوق التنبيه بالجلسة */
        .hearing-alert { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-bottom: 15px; border: 1px solid transparent; display: none; }

        /* زر فتح الأرشيف المالي كصفحة منفصلة Modal */
        .financial-modal-btn-bar { grid-column: span 3; margin: 15px 0; }
        .btn-open-financial { background-color: #475569; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .modal-close-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .qrcode-section { text-align: center; margin-top: 10px; padding: 10px; background: #f8fafc; border: 2px dashed #e2e8f0; border-radius: 10px; display: none; }
        #qrcode { display: inline-block; margin-top: 5px; padding: 5px; background: white; border-radius: 6px; }
        .barcode-sub-text { margin-top: 4px; font-size: 13px; font-weight: bold; color: #dc2626; }

        .actions-section { display: flex; gap: 10px; justify-content: center; margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 15px; flex-wrap: wrap; }
        .btn-save { background-color: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-print { background-color: var(--print-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }

        #watermarkLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 9999; overflow: hidden; opacity: 0;
        }
        .watermark-text-style {
            font-size: 60px; font-weight: bold; color: rgba(30, 58, 138, 0.08);
            transform: rotate(-35deg); white-space: nowrap; text-align: center; user-select: none;
        }

        @media print {
            body { background: white !important; padding: 0 !important; }
            .container { border: none !important; box-shadow: none !important; width: 100% !important; padding: 0 !important; }
            .user-bar, .search-container-top, .actions-section, .auth-card, #passwordSection, .financial-modal-btn-bar { display: none !important; }
            .hide-on-print { display: none !important; }
            #watermarkLayer { opacity: 1 !important; }
        }
    </style>
</head>
<body>

    <!-- تسجيل الدخول -->
    <div id="loginSection" class="auth-card">
        <h2>🔐 تسجيل الدخول للنظام</h2>
        <div class="auth-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="name@example.com">
        </div>
        <div class="auth-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button type="button" class="btn-main" onclick="loginUser()">دخول للنظام</button>
        <div id="loginError" class="error-text"></div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div class="container" id="appSection" style="display: none;">
        
        <div id="watermarkLayer"><div class="watermark-text-style" id="watermarkDisplay"></div></div>

        <div class="user-bar">
            <span>👤 المستخدم: <strong id="userEmailDisplay"></strong></span>
            <div class="user-actions">
                <button type="button" class="btn-settings" onclick="togglePasswordSection()">🔑 تغيير الرمز</button>
                <button type="button" class="btn-logout" onclick="logoutUser()">خروج</button>
            </div>
        </div>

        <div id="passwordSection" class="password-box">
            <h4 style="margin: 0 0 10px 0; font-size: 14px; color: var(--primary-color);">تغيير كلمة المرور</h4>
            <div style="display: flex; gap: 8px;">
                <input type="password" id="newPassword" placeholder="الجديدة (6 رموز على الأقل)" style="flex: 1;">
                <button type="button" class="btn-search" onclick="changeUserPassword()">تحديث</button>
            </div>
            <div id="passMessage" style="font-size: 12px; margin-top: 6px;"></div>
        </div>

        <h2 class="header-title">⚖️ نظام إدارة وتوثيق الدعاوى</h2>
        
        <!-- تنبيه الجلسة القادمة -->
        <div id="hearingAlertBox" class="hearing-alert"></div>

        <!-- أشرطة البحث -->
        <div class="search-container-top">
            <div class="search-box-item">
                <input type="text" id="searchQuery" placeholder="بحث برقم الدعوة...">
                <button type="button" class="btn-search" onclick="fetchDataFromFirebase()">🔍 بحث الدعوى</button>
            </div>
        </div>

        <form id="lawForm">
            <div class="form-grid">
                
                <!-- بيانات أساسية -->
                <div class="section-title">📌 البيانات الأساسية للدعوى</div>
                
                <div class="form-group">
                    <label>رقم الدعوة:</label>
                    <input type="text" id="caseNumber" placeholder="مثال: 2/ب/2026">
                </div>
                <div class="form-group">
                    <label>المحكمة المختصة:</label>
                    <input type="text" id="court" placeholder="مثال: بداءة بغداد">
                </div>
                <div class="form-group">
                    <label>عنوان الدعوة (موضوعها):</label>
                    <input type="text" id="caseTitle" placeholder="أدخل موضوع الدعوة">
                </div>

                <!-- الأطراف (هاتف الموكل فقط) -->
                <div class="form-group">
                    <label>اسم المشتكي / المدعي:</label>
                    <input type="text" id="complainant" placeholder="الاسم الثلاثي">
                </div>
                <div class="form-group">
                    <label>هاتف الموكل:</label>
                    <input type="text" id="complainantPhone" placeholder="رقم الهاتف">
                </div>
                <div class="form-group">
                    <label>اسم المشكو منه / الخصم:</label>
                    <input type="text" id="defendant" placeholder="الاسم الثلاثي">
                </div>

                <!-- تاريخ ووقت الجلسة القادمة -->
                <div class="section-title">📅 موعد الجلسة القادمة (التاريخ والوقت)</div>

                <div class="form-group full-width">
                    <label>موعد الجلسة القادمة (التاريخ والوقت):</label>
                    <input type="datetime-local" id="nextHearingDate" onchange="checkHearingAlert(this.value)">
                </div>

                <!-- زر فتح صفحة الأرشيف المالي المنفصلة -->
                <div class="financial-modal-btn-bar hide-on-print">
                    <button type="button" class="btn-open-financial" onclick="openFinancialModal()">💰 فتح صفحة الأرشيف المالي</button>
                </div>

                <!-- إعدادات المرفقات -->
                <div class="section-title">⚙️ المرفقات والإعدادات الخاصة</div>

                <div class="form-group hide-on-print">
                    <label>مرفقات الدعوة (صورة/ملف):</label>
                    <input type="file" id="attachment" accept=".jpg, .jpeg, .png" onchange="handleFileSelect(event)">
                </div>
                <div class="form-group hide-on-print">
                    <label>رابط موقع الدعوة (QR):</label>
                    <input type="text" id="locationUrl" placeholder="https://example.com">
                </div>
                <div class="form-group hide-on-print">
                    <label>النص السفلي للباركود:</label>
                    <input type="text" id="barcodeSubText" placeholder="مثال: صالح للنشر والاعتماد">
                </div>
                <div class="form-group hide-on-print">
                    <label>اسم المسؤول (الورقة المائية):</label>
                    <input type="text" id="watermarkText" placeholder="مثال: المحامي فلان">
                </div>
                <div class="form-group full-width hide-on-print">
                    <label>ملاحظات سرية / إدارية:</label>
                    <textarea id="privateNotes" placeholder="ملاحظات لا تظهر للعميل..."></textarea>
                </div>
                <div class="form-group full-width hide-on-print">
                    <div id="fileInfo" style="font-size: 12px; color: #64748b;"></div>
                </div>
            </div>

            <div class="qrcode-section" id="qrcodeContainer">
                <span style="font-size: 12px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px;">QR Code الرسمي:</span>
                <div id="qrcode"></div>
                <div id="barcodeSubTextDisplay" class="barcode-sub-text"></div>
            </div>

            <div class="actions-section">
                <button type="button" class="btn-save" onclick="saveDataToFirebase()">💾 حفظ بالكامل</button>
                <button type="button" class="btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
            </div>
        </form>
    </div>

    <!-- نافذة صفحة الأرشيف المالي المنفصلة (Modal) -->
    <div id="financialModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; color: var(--primary-color);">💰 الأرشيف المالي للدعوى</h3>
                <button type="button" class="modal-close-btn" onclick="closeFinancialModal()">✕ إغلاق</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group" style="margin: 0;">
                    <label>أتعاب المحاماة الكلية (د.ع):</label>
                    <input type="number" id="totalFees" placeholder="مثال: 1000000">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label>المبالغ المستلمة مقدماً:</label>
                    <input type="number" id="paidFees" placeholder="مثال: 500000">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label>المصاريف القضائية المدفوعة:</label>
                    <input type="number" id="courtExpenses" placeholder="رسوم، خبراء...">
                </div>
                <button type="button" class="btn-main" style="margin-top: 10px;" onclick="closeFinancialModal()">حفظ وإغلاق النافذة</button>
            </div>
        </div>
    </div>

<script>
    function generateQRCode() {
        const urlInput = document.getElementById('locationUrl').value.trim();
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        if (urlInput === "") return;
        qrcodeContainer.style.display = "block";
        qrcodeDiv.innerHTML = "";
        new QRCode(qrcodeDiv, {
            text: urlInput, width: 80, height: 80, colorDark : "#1e3a8a", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
        });
    }
    document.getElementById('locationUrl').addEventListener('input', generateQRCode);
    document.getElementById('barcodeSubTest')?.addEventListener('input', function() {
        document.getElementById('barcodeSubTextDisplay').textContent = this.value;
    });
    document.getElementById('watermarkText').addEventListener('input', function() {
        document.getElementById('watermarkDisplay').textContent = this.value;
    });
</script>
</body>
</html>
