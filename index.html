<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتوثيق الدعاوى القضائية وموسوعة القوانين العراقية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCnAg_4zW8BHVjKp_C-38E-0LNBj8OmyFg",
          authDomain: "lawyer-29611.firebaseapp.com",
          projectId: "lawyer-29611",
          storageBucket: "lawyer-29611.firebasestorage.app",
          messagingSenderId: "545328949989",
          appId: "1:545328949989:web:1f3e49f0a7a8269267020c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedFileBase64 = "";
        let selectedFileName = "";

        onAuthStateChanged(auth, (user) => {
            const loginBox = document.getElementById('loginSection');
            const appBox = document.getElementById('appSection');
            const userEmailSpan = document.getElementById('userEmailDisplay');

            if (user) {
                currentUser = user;
                loginBox.style.display = 'none';
                appBox.style.display = 'block';
                userEmailSpan.textContent = user.email;
            } else {
                currentUser = null;
                loginBox.style.display = 'block';
                appBox.style.display = 'none';
                document.getElementById('email').value = "";
                document.getElementById('password').value = "";
            }
        });

        window.loginUser = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('loginError');

            if (!email || !password) {
                errorMsg.textContent = "يرجى إدخال البريد وكلمة المرور.";
                return;
            }

            try {
                errorMsg.style.color = "#3b82f6";
                errorMsg.textContent = "جاري تسجيل الدخول...";
                await signInWithEmailAndPassword(auth, email, password);
                errorMsg.textContent = "";
            } catch (error) {
                errorMsg.style.color = "#ef4444";
                errorMsg.textContent = "فشل: " + error.message;
            }
        };

        window.logoutUser = async function() {
            await signOut(auth);
        };

        window.changeUserPassword = async function() {
            if (!currentUser) return;
            const newPass = document.getElementById('newPassword').value.trim();
            const passMsg = document.getElementById('passMessage');

            if (!newPass || newPass.length < 6) {
                passMsg.style.color = "#ef4444";
                passMsg.textContent = "6 رموز على الأقل.";
                return;
            }

            try {
                passMsg.style.color = "#3b82f6";
                passMsg.textContent = "جاري التحديث...";
                await updatePassword(currentUser, newPass);
                passMsg.style.color = "#10b981";
                passMsg.textContent = "تم التحديث بنجاح! ✅";
                document.getElementById('newPassword').value = "";
                setTimeout(() => {
                    document.getElementById('passwordSection').style.display = "none";
                    passMsg.textContent = "";
                }, 3000);
            } catch (error) {
                passMsg.style.color = "#ef4444";
                passMsg.textContent = "فشل: " + error.message;
            }
        };

        window.togglePasswordSection = function() {
            const section = document.getElementById('passwordSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        };

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const maxWidth = 800;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    selectedFileBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('fileInfo').innerHTML = `📎 تم ضغط وتجهيز الصورة بنجاح: <b>${file.name}</b>`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveDataToFirebase = async function() {
            if (!currentUser) {
                alert("يرجى تسجيل الدخول أولاً!");
                return;
            }

            const caseNumber = document.getElementById('caseNumber').value.trim();
            const complainant = document.getElementById('complainant').value.trim();
            
            if (!caseNumber || !complainant) {
                alert("يرجى إدخال رقم الدعوة واسم المشتكي!");
                return;
            }

            try {
                const docId = caseNumber.replace(/\//g, '_');
                
                const caseData = {
                    userId: currentUser.uid,
                    caseNumber: caseNumber,
                    caseTitle: document.getElementById('caseTitle').value,
                    complainant: complainant,
                    defendant: document.getElementById('defendant').value,
                    court: document.getElementById('court').value,
                    locationUrl: document.getElementById('locationUrl').value,
                    privateNotes: document.getElementById('privateNotes').value,
                    watermarkText: document.getElementById('watermarkText').value,
                    barcodeSubText: document.getElementById('barcodeSubText').value,
                    fileData: selectedFileBase64 || "",
                    fileName: selectedFileName || ""
                };

                await setDoc(doc(db, "cases", docId), caseData);
                alert("تم حفظ الدعوة بنجاح تام! ✅");
            } catch (error) {
                alert("خطأ أثناء الحفظ: " + error.message);
            }
        };

        window.fetchDataFromFirebase = async function() {
            if (!currentUser) return;
            const queryNum = document.getElementById('searchQuery').value.trim();
            if (!queryNum) {
                alert("أدخل رقم الدعوة للبحث.");
                return;
            }

            try {
                const docId = queryNum.replace(/\//g, '_');
                const docRef = doc(db, "cases", docId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('caseNumber').value = data.caseNumber || '';
                    document.getElementById('caseTitle').value = data.caseTitle || '';
                    document.getElementById('complainant').value = data.complainant || '';
                    document.getElementById('defendant').value = data.defendant || '';
                    document.getElementById('court').value = data.court || '';
                    document.getElementById('locationUrl').value = data.locationUrl || '';
                    document.getElementById('privateNotes').value = data.privateNotes || '';
                    document.getElementById('watermarkText').value = data.watermarkText || '';
                    document.getElementById('barcodeSubText').value = data.barcodeSubText || '';
                    
                    if (data.locationUrl) generateQRCode();
                    if (data.barcodeSubText) {
                        document.getElementById('barcodeSubTextDisplay').textContent = data.barcodeSubText;
                    }

                    selectedFileBase64 = data.fileData || "";
                    selectedFileName = data.fileName || "";

                    if (selectedFileName) {
                        document.getElementById('fileInfo').innerHTML = `📎 الملف المرفق: <a href="${selectedFileBase64}" download="${selectedFileName}" style="color: #2980b9; font-weight: bold;">تحميل (${selectedFileName})</a>`;
                    } else {
                        document.getElementById('fileInfo').textContent = "";
                    }
                    alert("تم استرجاع الدعوة بنجاح! 🔍");
                } else {
                    alert("لم يتم العثور على دعوة بهذا الرقم.");
                }
            } catch (error) {
                alert("خطأ: " + error.message);
            }
        };
    </script>

    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --print-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        .container { max-width: 850px; background: var(--card-bg); margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        
        .auth-card { max-width: 380px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; text-align: center; }
        .auth-card h2 { color: var(--primary-color); margin-bottom: 20px; font-size: 20px; }
        .auth-group { margin-bottom: 15px; text-align: right; }
        .auth-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .auth-group input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-main { background-color: var(--primary-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .error-text { font-size: 13px; margin-top: 10px; word-break: break-word; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; border: 1px solid #bfdbfe; flex-wrap: wrap; gap: 10px; }
        .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-settings { background-color: var(--print-color); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-legal { background-color: #8b5cf6; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-logout { background-color: var(--danger-color); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        .password-box { background: #fff; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .header-title { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-size: 22px; font-weight: 700; }
        .search-section { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        .search-section input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
        .btn-search { background-color: var(--secondary-color); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; font-size: 13px; }
        input[type="text"], input[type="url"], input[type="file"], input[type="email"], input[type="password"], textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #fdfdfd; font-family: inherit; }
        input[type="file"] { padding: 6px; background: #f8fafc; cursor: pointer; }
        textarea { resize: vertical; height: 75px; }
        .qrcode-section { text-align: center; margin-top: 12px; padding: 12px; background: #f8fafc; border: 2px dashed #e2e8f0; border-radius: 12px; display: none; }
        #qrcode { display: inline-block; margin-top: 6px; padding: 6px; background: white; border-radius: 8px; }
        
        .barcode-sub-text {
            margin-top: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #dc2626;
        }

        .actions-section { display: flex; gap: 10px; justify-content: center; margin-top: 20px; border-top: 1px solid #f1f5f9; padding-top: 15px; }
        .btn-save { background-color: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
        .btn-print { background-color: var(--print-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }

        /* نافذة القوانين المنبثقة (Modal) */
        #legalModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .legal-modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .legal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .legal-header h3 { margin: 0; color: var(--primary-color); }
        .close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }
        .legal-search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .legal-results {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            background: #f8fafc;
        }
        .law-card {
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .law-card h4 { margin: 0 0 6px 0; color: var(--primary-color); font-size: 15px; }
        .law-card p { margin: 4px 0; font-size: 13px; color: #334155; }
        .law-card .explanation { background: #eff6ff; padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 13px; color: #1e40af; border-right: 3px solid var(--secondary-color); }

        #watermarkLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
            opacity: 0;
        }
        .watermark-text-style {
            font-size: 60px;
            font-weight: bold;
            color: rgba(30, 58, 138, 0.08);
            transform: rotate(-35deg);
            white-space: nowrap;
            text-align: center;
            user-select: none;
        }

        @media print {
            body { background: white !important; padding: 0 !important; }
            .container { border: none !important; box-shadow: none !important; width: 100% !important; padding: 0 !important; }
            .user-bar, .search-section, .actions-section, .auth-card, #passwordSection { display: none !important; }
            .hide-on-print { display: none !important; }
            #watermarkLayer { opacity: 1 !important; }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="auth-card">
        <h2>🔐 تسجيل الدخول للنظام</h2>
        <div class="auth-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="off">
        </div>
        <div class="auth-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" placeholder="********" autocomplete="new-password">
        </div>
        <button type="button" class="btn-main" onclick="loginUser()">تسجيل الدخول</button>
        <div id="loginError" class="error-text"></div>
    </div>

    <!-- نافذة القوانين العراقية (Modal) -->
    <div id="legalModal">
        <div class="legal-modal-content">
            <div class="legal-header">
                <h3>⚖️ موسوعة القوانين العراقية الشاملة</h3>
                <button type="button" class="close-modal" onclick="closeLegalModal()">✕</button>
            </div>
            <div class="legal-search-box">
                <input type="text" id="legalSearchInput" placeholder="بحث برقم المادة (مثال: 405، 150) أو اسم القانون أو الكلمة المفتاحية..." oninput="searchLaws()">
                <button type="button" class="btn-search" onclick="searchLaws()">بحث</button>
            </div>
            <div style="margin-bottom: 8px; font-size: 12px; color: #64748b;">
                البحث الفوري يشمل مواد قانون العقوبات، المدني، المرافعات، الإثبات، الأحوال الشخصية، أصول المحاكمات الجزائية:
            </div>
            <div class="legal-results" id="legalResultsContainer">
                <!-- نتائج البحث تظهر هنا -->
            </div>
        </div>
    </div>

    <!-- واجهة النظام الرئيسية -->
    <div class="container" id="appSection" style="display: none;">
        
        <div id="watermarkLayer">
            <div class="watermark-text-style" id="watermarkDisplay"></div>
        </div>

        <div class="user-bar">
            <span>👤 المستخدم: <strong id="userEmailDisplay"></strong></span>
            <div class="user-actions">
                <button type="button" class="btn-legal" onclick="openLegalModal()">📜 قانونيات</button>
                <button type="button" class="btn-settings" onclick="togglePasswordSection()">🔑 تغيير الرمز</button>
                <button type="button" class="btn-logout" onclick="logoutUser()">خروج</button>
            </div>
        </div>

        <div id="passwordSection" class="password-box">
            <h4 style="margin: 0 0 10px 0; font-size: 15px; color: var(--primary-color);">تغيير كلمة المرور</h4>
            <div style="display: flex; gap: 8px;">
                <input type="password" id="newPassword" placeholder="الجديدة (6 رموز على الأقل)" style="flex: 1;">
                <button type="button" class="btn-search" onclick="changeUserPassword()">تحديث</button>
            </div>
            <div id="passMessage" style="font-size: 12px; margin-top: 6px;"></div>
        </div>

        <h2 class="header-title">⚖️ نظام إدارة وتوثيق الدعاوى</h2>
        
        <div class="search-section">
            <input type="text" id="searchQuery" placeholder="بحث برقم الدعوة...">
            <button type="button" class="btn-search" onclick="fetchDataFromFirebase()">🔍 استعلام</button>
        </div>

        <form id="lawForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>رقم الدعوة:</label>
                    <input type="text" id="caseNumber" placeholder="مثال: 2">
                </div>
                <div class="form-group">
                    <label>المحكمة المختصة:</label>
                    <input type="text" id="court" placeholder="مثال: بداءة بغداد">
                </div>
                <div class="form-group full-width">
                    <label>عنوان الدعوة (موضوعها):</label>
                    <input type="text" id="caseTitle" placeholder="أدخل موضوع الدعوة">
                </div>
                <div class="form-group">
                    <label>اسم المشتكي:</label>
                    <input type="text" id="complainant" placeholder="الاسم الثلاثي">
                </div>
                <div class="form-group">
                    <label>اسم المشكو منه:</label>
                    <input type="text" id="defendant" placeholder="الاسم الثلاثي">
                </div>

                <div class="form-group full-width hide-on-print">
                    <label>مرفقات الدعوة (صورة أو ملف):</label>
                    <input type="file" id="attachment" accept=".jpg, .jpeg, .png" onchange="handleFileSelect(event)">
                    <div id="fileInfo" style="margin-top: 5px; font-size: 12px; color: #64748b;"></div>
                </div>

                <div class="form-group full-width hide-on-print">
                    <label>رابط موقع الدعوة (الإلكتروني):</label>
                    <input type="text" id="locationUrl" placeholder="https://example.com">
                </div>

                <div class="form-group full-width hide-on-print">
                    <label>النص السفلي للباركود (يظهر باللون الأحمر تحت الباركود عند الطباعة):</label>
                    <input type="text" id="barcodeSubText" placeholder="مثال: صالح للنشر والاعتماد الرسمي">
                </div>

                <div class="form-group full-width hide-on-print">
                    <label>ملاحظات إضافية (خاصة بالحفظ الداخلي ولا تظهر عند الطباعة):</label>
                    <textarea id="privateNotes" placeholder="أدخل أي ملاحظات سرية أو إدارية خاصة بالدعوة..."></textarea>
                </div>

                <div class="form-group full-width hide-on-print">
                    <label>اسم المسؤول / المدقق (يظهر كورقة مائية خلفية للطباعة لمنع التزوير):</label>
                    <input type="text" id="watermarkText" placeholder="مثال: م, أحمد العزاوي - شعبة التدقيق">
                </div>
            </div>

            <div class="qrcode-section" id="qrcodeContainer">
                <span style="font-size: 12px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px;">QR Code (رمز التحقق الرسمي):</span>
                <div id="qrcode"></div>
                <div id="barcodeSubTextDisplay" class="barcode-sub-text"></div>
            </div>

            <div class="actions-section">
                <button type="button" class="btn-save" onclick="saveDataToFirebase()">💾 حفظ في النظام</button>
                <button type="button" class="btn-print" onclick="window.print()">🖨️ طباعة</button>
            </div>
        </form>

    </div>

<script>
    // قاعدة بيانات موسعة لأهم وأبرز المواد القانونية في القوانين العراقية
    const iraqiLawsDatabase = [
        // قانون العقوبات رقم 111 لسنة 1969
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "1", text: "لا جريمة ولا عقوبة إلا بناء على قانون وتطبق على الأفعال المرتكبة في زمان نفاذ القانون.", explanation: "مبدأ الشرعية الجنائية." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "405", text: "من قتل إنساناً عمداً يعاقب بالسجن المؤبد أو المؤقت.", explanation: "جريمة القتل العمد المجرد عن الظروف المشددة." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "406", text: "يعاقب بالاعدام من قتل إنساناً عمداً مع سبق الإصرار أو الترصد...", explanation: "القتل العمد مع سبق الإصرار والترصد أو ارتكابه ضد أصول." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "410", text: "من جرح إنساناً أو ضربه عمداً فأحدث به عجزاً أو عاهة مستديمة يعاقب بالسجن مدة لا تزيد على خمس عشرة سنة.", explanation: "جريمة الضرب المفضي إلى عاهة مستديمة." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "413", text: "من ضرب إنساناً أو جرحه ولم يبلغ الفعل درجة العاهة المستديمة... يعاقب بالحبس.", explanation: "جريمة الإيذاء البسيط." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "430", text: "من هدد آخر بالقتل أو بارتكاب جناية ضد نفسه أو ماله يعاقب بالحبس.", explanation: "جريمة التهديد بارتكاب جناية." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "433", text: "القذف هو اسناد واقعة معينة إلى غيره توجب عقابه قانوناً أو تحقر منه...", explanation: "جريمة القذف والطعن بالسمعة." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "434", text: "السب هو خدش الشرف أو الاعتبار ولو لم يتضمن اسناد واقعة معينة...", explanation: "جريمة السب والشتم العلني أو غير العلني." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "443", text: "يعاقب بالسجن مدة لا تزيد على سبع سنوات من سرق مالاً ليلاً من محل مسكون...", explanation: "حالات السرقة المشددة." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "453", text: "من استولى بغير حق على مال منقول مملوك لغيره تسلمه بحوت أمانة...", explanation: "جريمة خيانة الأمانة." },
        { lawName: "قانون العقوبات العراقي رقم 111 لسنة 1969", article: "456", text: "يعاقب بالحبس من توصل إلى تسلم مال منقول بحتي بطرق احتيالية...", explanation: "جريمة الاحتيال والنصب." },

        // القانون المدني العراقي رقم 40 لسنة 1951
        { lawName: "القانون المدني العراقي رقم 40 لسنة 1951", article: "1", text: "تطبق النصوص التشريعية على جميع المسائل التي تناولتها هذه النصوص في لفظها أو فحواها.", explanation: "المصادر الرسمية للتشريع وتطبيقه." },
        { lawName: "القانون المدني العراقي رقم 40 لسنة 1951", article: "150", text: "العقد شريعة المتعاقدين، فلا يجوز نقضه ولا تعديله إلا باتفاق الطرفين أو لأسباب قانونية.", explanation: "مبدأ قوة العقد الملزمة." },
        { lawName: "القانون المدني العراقي رقم 40 لسنة 1951", article: "256", text: "إذا لم يوف المدين بالتزامه جاز للمحكمة إلزامه بالتنفيذ العيني متى كان ممكناً.", explanation: "أحكام التنفيذ العيني للالتزامات." },
        { lawName: "القانون المدني العراقي رقم 40 لسنة 1951", article: "262", text: "يقدر التعويض في كل التزام بنقود بقدر ما لحق الدائن من خسارة وما فاته من كسب...", explanation: "قواعد تقدير التعويض المدني." },
        { lawName: "القانون المدني العراقي رقم 40 لسنة 1951", article: "506", text: "البيع تبادل مال بمال.", explanation: "التعريف القانوني لعقد البيع." },

        // قانون الإثبات العراقي رقم 107 لسنة 1979
        { lawName: "قانون الإثبات العراقي رقم 107 لسنة 1979", article: "1", text: "البينة على من ادعى واليمين على من أنكر.", explanation: "القاعدة الذهبية في الإثبات القضائي." },
        { lawName: "قانون الإثبات العراقي رقم 107 لسنة 1979", article: "69", text: "الكتابة الرسمية حجة على الناس كافة بما روته الموظف العام أو وثقه قانوناً.", explanation: "قوة الأوراق الرسمية في الإثبات." },
        { lawName: "قانون الإثبات العراقي رقم 107 لسنة 1979", article: "115", text: "يجوز إثبات الالتزامات بالشهادة فيما لم تزد قيمته على خمسة آلاف دينار...", explanation: "حدود الإثبات بشهادة الشهود في المسائل المدنية." },

        // قانون المرافعات المدنية رقم 83 لسنة 1969
        { lawName: "قانون المرافعات المدنية العراقي رقم 83 لسنة 1969", article: "1", text: "تختص المحاكم العراقية بنظر جميع الدعاوى التي تقام على العراقي إلا ما استثني بنص.", explanation: "ولاية المحاكم العراقية." },
        { lawName: "قانون المرافعات المدنية العراقي رقم 83 لسنة 1969", article: "30", text: "ترفع الدعوى بعريضة تقدم إلى المحكمة مختومة بخاتم الرسم وتسجل في السجل الخاص.", explanation: "إجراءات رفع الدعوى المدنية." },

        // قانون أصول المحاكمات الجزائية رقم 23 لسنة 1971
        { lawName: "قانون أصول المحاكمات الجزائية العراقي", article: "1", text: "لا تحرك الدعوى الجزائية إلا بناء على شكوى متضرر في الجرائم المنصوص عليها قانوناً.", explanation: "الجرائم التي تتطلب شكوى مجني عليه لتحريكها." },
        { lawName: "قانون أصول المحاكمات الجزائية العراقي", article: "39", text: "لكل من شاهد جريمة مشهودة أن يقبض على المتهم ويحضره لدى السلطات فوراً.", explanation: "حق القبض في الجرائم المشهودة." },

        // قانون الأحوال الشخصية رقم 188 لسنة 1959
        { lawName: "قانون الأحوال الشخصية العراقي رقم 188 لسنة 1959", article: "3", text: "شرط الأهلية للزواج هو العقل وإتمام الثامنة عشرة من العمر.", explanation: "السن القانوني للأهلية للزواج في العراق." },
        { lawName: "قانون الأحوال الشخصية العراقي رقم 188 لسنة 1959", article: "34", text: "النفقة الواجبة للزوجة تشمل الطعام والكسوة والمسكن والتطبيب بالمعروف.", explanation: "وجوب النفقة الزوجية." }
    ];

    function openLegalModal() {
        document.getElementById('legalModal').style.display = 'flex';
        displayAllLaws(iraqiLawsDatabase);
    }

    function closeLegalModal() {
        document.getElementById('legalModal').style.display = 'none';
    }

    function displayAllLaws(lawsArray) {
        const container = document.getElementById('legalResultsContainer');
        container.innerHTML = "";
        
        if (lawsArray.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #64748b; padding: 20px;">لم يتم العثور على مواد مطابقة للبحث.</p>`;
            return;
        }

        lawsArray.forEach(item => {
            container.innerHTML += `
                <div class="law-card">
                    <h4>📜 ${item.lawName} - المادة (${item.article})</h4>
                    <p><b>نص المادة:</b> ${item.text}</p>
                    <div class="explanation">💡 <b>الشرح والتفسير القضائي:</b> ${item.explanation}</div>
                </div>
            `;
        });
    }

    function searchLaws() {
        const query = document.getElementById('legalSearchInput').value.trim().toLowerCase();
        if (!query) {
            displayAllLaws(iraqiLawsDatabase);
            return;
        }

        const filtered = iraqiLawsDatabase.filter(item => {
            return item.article.toLowerCase() === query || 
                   item.text.toLowerCase().includes(query) || 
                   item.lawName.toLowerCase().includes(query) ||
                   item.explanation.toLowerCase().includes(query);
        });

        displayAllLaws(filtered);
    }

    function generateQRCode() {
        const urlInput = document.getElementById('locationUrl').value.trim();
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        if (urlInput === "") return;
        qrcodeContainer.style.display = "block";
        qrcodeDiv.innerHTML = "";
        new QRCode(qrcodeDiv, {
            text: urlInput,
            width: 90,
            height: 90,
            colorDark : "#1e3a8a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }
    document.getElementById('locationUrl').addEventListener('input', generateQRCode);

    document.getElementById('barcodeSubText').addEventListener('input', function() {
        document.getElementById('barcodeSubTextDisplay').textContent = this.value;
    });

    document.getElementById('watermarkText').addEventListener('input', function() {
        document.getElementById('watermarkDisplay').textContent = this.value;
    });
</script>
</body>
</html>
